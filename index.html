<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comic Library — คลังการ์ตูนออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#f6f4ef;--surface:#fff;--ink:#16213a;--muted:#68718a;--brand:#1f3a68;--accent:#e8892b;--purple:#1f3a68;--pink:#e8892b;--red:#c9433a;--line:#e4dfd3}
html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}a{color:inherit;text-decoration:none}
.site{position:sticky;top:0;z-index:50;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;height:64px;display:flex;align-items:center;gap:28px;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--brand)}.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px}
.links{display:flex;gap:6px;flex:1}.links a{padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}.links a:hover,.links a.on{color:var(--brand);background:#eef1f7}
.hero{background:var(--brand);color:#fff;padding:64px 20px 72px;text-align:center;background-image:radial-gradient(circle at 85% 20%,#e8892b40,transparent 40%),radial-gradient(circle at 10% 90%,#ffffff18,transparent 40%)}
.heroin{max-width:680px;margin:auto}.eyebrow{color:#ffc98f;font-weight:700;letter-spacing:.5px;margin:0 0 8px}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.25;margin:0 0 12px}.hero p{margin:0 0 24px;opacity:.9}
.search{width:100%;max-width:460px;padding:14px 20px;border-radius:999px;border:0;font-size:16px;outline:0;box-shadow:0 8px 24px #0004}
.wrap{max-width:1180px;margin:auto;padding:40px 20px 60px}.narrow{max-width:440px;margin:auto;padding:50px 20px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:24px}.sechead h2{margin:0;font-size:24px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px}.toolbar h1{margin:0}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.card{transition:.2s}.card:hover{transform:translateY(-4px)}
.cover{display:block;position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#e6e1d6;box-shadow:0 6px 18px #16213a26}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;height:100%;font-size:48px}.badge{position:absolute;left:8px;bottom:8px;background:#16213ad9;color:#fff;font-size:12px;padding:3px 10px;border-radius:999px}
.cbody{padding:12px 2px}.cbody h3{margin:0 0 8px;font-size:16px;line-height:1.35}
.crumb{display:inline-block;color:var(--muted);font-weight:600;margin-bottom:18px}.crumb:hover{color:var(--brand)}
.detail{display:grid;grid-template-columns:260px 1fr;gap:36px;align-items:start}.detail h1{margin:0 0 4px;font-size:32px}.dcover{border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:#e6e1d6;box-shadow:0 10px 30px #16213a33}.dcover img{width:100%;height:100%;object-fit:cover}
.btn{padding:9px 16px;border-radius:8px;background:#eceff6;color:#1f2a44;font-weight:700;transition:.15s;display:inline-block}.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--brand);color:#fff}.btn.dark{background:var(--ink);color:#fff}.btn.danger{background:#fbe6e4;color:var(--red)}.btn.small{padding:7px 13px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.loginCard h1{margin:0 0 4px;font-size:24px}.err{color:var(--red);margin:12px 0 0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}.field input{width:100%;padding:11px 13px;border:1px solid #cfc9bb;border-radius:8px;background:#fff}.field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.row{display:flex;gap:16px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.meta{color:var(--muted);font-size:14px}.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:18px}
.coverPreview{width:90px;height:120px;flex:none;border-radius:8px;overflow:hidden;background:#e6e1d6;display:grid;place-items:center;font-size:32px}.coverPreview img{width:100%;height:100%;object-fit:cover}
.chapterList{display:flex;flex-direction:column;gap:8px}.chapter{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);padding:12px 16px;border-radius:10px}.chapter:hover{border-color:var(--accent)}.chapter .name{font-weight:700}
.site-foot{text-align:center;padding:28px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}

.reader{background:#151326;min-height:100vh;color:white;position:relative;overflow:hidden;width:100%;height:100%;} .reader:fullscreen{width:100vw;height:100vh;background:#151326;}
.readerbar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(100deg,#1c1733,#341d57);padding:10px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;box-shadow:0 -5px 25px rgba(0,0,0,.5);border-top:1px solid rgba(255,255,255,.1);transition:transform 0.3s ease;}
.readerbar.hidden-bar{transform:translateY(100%);pointer-events:none;}
.readerbar select,.readerbar input{padding:7px;border-radius:8px;border:0;background:#2b2342;color:#fff}
.readerbar select option{background:#1c1733;color:#fff}
.readerbar .spacer{flex:1}

.readerbook{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 82px;overflow:auto}
.zoomControls{display:flex;align-items:center;gap:4px}
.zoomControls button{width:34px;height:34px;border-radius:9px;background:#2b2342;color:#fff;font-size:16px;font-weight:800;display:grid;place-items:center}
.zoomControls button:hover{background:#3a2f57}
.zoomControls .zlabel{min-width:46px;text-align:center;font-size:12px;opacity:.85}
.pageNav{position:fixed;top:50%;transform:translateY(-50%);z-index:120;width:58px;height:120px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(28,23,51,.82);color:#fff;font-size:48px;line-height:1;display:grid;place-items:center;box-shadow:0 8px 28px #0008;backdrop-filter:blur(5px);transition:.18s ease;cursor:pointer}
.pageNav:hover{transform:translateY(-50%) scale(1.06);background:rgba(70,45,100,.95)}
.pageNav.prev{left:14px}.pageNav.next{right:14px}
.pdfstage{display:flex;justify-content:center;gap:0;padding:10px;min-height:calc(100vh - 40px);align-items:center;perspective:1800px;transform-origin:center center;transition:transform .12s ease-out;touch-action:pan-x pan-y}
.pdfstage.zooming{transition:none}.pdfstage.double{gap:0}.pdfstage.double .pagewrap{border-radius:0;box-shadow:none}.pdfstage.double .pagewrap:first-child{box-shadow:-10px 12px 35px #0006}.pdfstage.double .pagewrap:last-child{box-shadow:10px 12px 35px #0006}.pdfstage.double .pagewrap:first-child canvas{border-right:1px solid #ddd}.pdfstage.double .pagewrap:last-child canvas{border-left:1px solid #ddd}
.pagewrap{background:#fff;box-shadow:0 12px 40px #0009;position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;backface-visibility:hidden}.pagewrap.spread-left{transform-origin:right center}.pagewrap.spread-right{transform-origin:left center}.pdfstage.turning-next .spread-right{transform:rotateY(-78deg);opacity:.05;z-index:5}.pdfstage.turning-next .spread-left{transform:translateX(-2px);opacity:.7}.pdfstage.turning-prev .spread-left{transform:rotateY(78deg);opacity:.05;z-index:5}.pdfstage.turning-prev .spread-right{transform:translateX(2px);opacity:.7}
.pagewrap canvas{display:block;max-width:calc(50vw - 20px);max-height:95vh;width:auto;height:auto}
.single .pagewrap canvas{max-width:min(95vw, 900px);max-height:95vh}
.device-fold .pagewrap canvas{max-width:calc(48vw - 10px);max-height:92vh}
.device-fold.single .pagewrap canvas{max-width:min(98vw, 650px);max-height:92vh}

.readerHint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#000a;padding:5px 14px;border-radius:20px;font-size:12px;z-index:90;pointer-events:none;transition:opacity 0.3s;}
.modal{position:fixed;inset:0;background:#16213a99;backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:200}.modalbox{background:#fff;border-radius:14px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px #0005}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:20px}.close{width:34px;height:34px;border-radius:50%;background:#eceff6;font-size:20px}
.coverNote{font-size:12px;color:#77809a;margin-top:5px}.saving{opacity:.65;pointer-events:none}
.progressOverlay{position:fixed;inset:0;background:#1c1733e6;backdrop-filter:blur(2px);display:grid;place-items:center;z-index:300;color:#fff}
.progressBox{width:min(360px,88vw);text-align:center;background:#251d3f;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:26px 22px;box-shadow:0 20px 55px #0007}
.progressPct{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.progressBarTrack{width:100%;height:12px;background:#150f28;border-radius:8px;overflow:hidden;margin:14px 0;border:1px solid rgba(255,255,255,.08)}
.progressBarFill{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));transition:width .18s ease;border-radius:8px}
.progressLabel{font-size:13px;opacity:.85;line-height:1.5;word-break:break-word}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.dcover{max-width:220px}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}.bar{gap:10px;padding:0 12px}.logo{font-size:16px}.hero{padding:44px 16px 52px}}

/* ===== ธีมสีสดใส + ไอคอนตกแต่ง ===== */
:root{--brand:#7c3aed;--accent:#ff5c8a;--purple:#7c3aed;--pink:#ff5c8a;--line:#ffd9a8}
body{background:linear-gradient(135deg,#fff3e0 0%,#ffe9f3 40%,#e8f4ff 75%,#eafff3 100%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#ff9ec4 1.5px,transparent 1.5px),radial-gradient(#7fd1ff 1.5px,transparent 1.5px);background-size:34px 34px,52px 52px;background-position:0 0,17px 22px}
.site{background:linear-gradient(100deg,#7c3aed,#ec4899 55%,#ff9f1c);border-bottom:0;box-shadow:0 4px 18px #7c3aed55}
.logo{color:#fff}.mark{background:#fff;font-size:20px;box-shadow:0 3px 0 #0003;transform:rotate(-6deg)}
.links a{color:#ffffffd9}.links a:hover,.links a.on{background:#ffffff33;color:#fff}
.site .btn{background:#fff;color:#7c3aed}.site .btn.dark{background:#16213a;color:#fff}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#7c3aed,#d946ef 45%,#ff7a45)}
.fl{position:absolute;font-size:36px;animation:flt 5s ease-in-out infinite;user-select:none}
.f1{left:7%;top:18%}.f2{right:9%;top:16%;animation-delay:.8s}.f3{left:15%;bottom:12%;animation-delay:1.6s}.f4{right:17%;bottom:10%;animation-delay:2.2s}.f5{left:47%;top:7%;font-size:26px;animation-delay:1s}.f6{right:32%;bottom:8%;font-size:28px;animation-delay:.3s}
@keyframes flt{50%{transform:translateY(-14px) rotate(10deg)}}
.eyebrow{background:#ffffff2b;display:inline-block;padding:4px 16px;border-radius:999px}
.search{border:3px solid #ffd166}
.sechead{border-bottom:3px dashed #ff9ec4}
.card .cover{border:4px solid var(--c,#ff5c8a);border-radius:18px;box-shadow:0 7px 0 var(--c,#ff5c8a),0 14px 24px #0002}
.card:nth-child(5n+1){--c:#ff5c8a}.card:nth-child(5n+2){--c:#3aa0ff}.card:nth-child(5n+3){--c:#2ecc71}.card:nth-child(5n+4){--c:#ffb703}.card:nth-child(5n+5){--c:#a855f7}
.card:hover .cover{transform:rotate(-1.5deg)}.badge{background:var(--c,#ff5c8a)}
.cbody h3:before{content:"⭐ ";font-size:13px}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 3px 0 #5b21b6}.btn.primary:active{transform:translateY(2px);box-shadow:none}
.btn.danger{background:#ffe1e6}.panel,.chapter{border:2px solid #ffd9a8;border-radius:16px}.chapter:hover{border-color:#ec4899;transform:translateX(4px)}
.dcover{border:5px solid #ff5c8a;box-shadow:0 9px 0 #ff5c8a,0 16px 30px #0003}.detail h1{color:#7c3aed}
.site-foot{background:linear-gradient(90deg,#ffe4ef,#fff3c4,#dff3ff);border-top:0}
#handCursor{position:fixed;left:0;top:0;z-index:400;pointer-events:none;font-size:40px;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 3px 4px #0008)}
.pdfstage.pannable,.pdfstage.pannable *{cursor:none!important}
#handHint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:350;pointer-events:none;text-align:center;color:#fff;background:#000b;padding:16px 24px;border-radius:22px;font-size:15px;animation:hfade 3.2s forwards}
#handHint .h{font-size:58px;display:block;animation:wave 1s ease-in-out infinite}
@keyframes hfade{0%,70%{opacity:1}100%{opacity:0}}@keyframes wave{50%{transform:translateX(18px) rotate(14deg)}}
</style>

let _pageTurnAudio=null;
function playPageTurnSound(){
  if(!state.soundOn)return;
  try{
    if(!_pageTurnAudio){
      _pageTurnAudio=new Audio("data:audio/mpeg;base64,"+PAGE_TURN_SOUND_B64);
      _pageTurnAudio.volume=0.55;
    }
    const a=_pageTurnAudio.cloneNode();
    a.volume=0.55;
    a.play().catch(()=>{});
  }catch(e){console.warn("page turn sound error",e)}
}

// ===== แถบแสดงเปอร์เซ็นต์ความคืบหน้า (ใช้ทั้งตอนอัปโหลดและตอนเปิดอ่าน) =====
function showProgressOverlay(label){
  if($("#progressOverlay"))return updateProgressOverlay(0,label);
  const el=document.createElement("div");
  el.className="progressOverlay";
  el.id="progressOverlay";
  el.innerHTML=`<div class="progressBox">
    <div class="progressPct" id="progressPct">0%</div>
    <div class="progressBarTrack"><div class="progressBarFill" id="progressBarFill" style="width:0%"></div></div>
    <div class="progressLabel" id="progressLabelText">${esc(label||"กำลังเตรียมข้อมูล...")}</div>
  </div>`;
  document.body.appendChild(el);
}
function updateProgressOverlay(pct,label){
  const p=$("#progressPct"),f=$("#progressBarFill"),l=$("#progressLabelText");
  const clamped=Math.max(0,Math.min(100,pct||0));
  if(p)p.textContent=Math.round(clamped)+"%";
  if(f)f.style.width=clamped+"%";
  if(l && label!==undefined)l.textContent=label;
}
function hideProgressOverlay(){
  const el=$("#progressOverlay");
  if(el)el.remove();
}

// โปรเจกต์ Supabase (ใช้สร้าง endpoint สำหรับอัปโหลดแบบ resumable/TUS)
const SUPABASE_PROJECT_ID=(SUPABASE_URL.match(/^https:\/\/([^.]+)\.supabase\.co/)||[])[1]||"";
const TUS_ENDPOINT=SUPABASE_PROJECT_ID?`https://${SUPABASE_PROJECT_ID}.storage.supabase.co/storage/v1/upload/resumable`:null;

// อัปโหลดไฟล์แบบ resumable (TUS) พร้อมรายงานเปอร์เซ็นต์ความคืบหน้าจริงผ่าน onProgress
// ใช้กับไฟล์ขนาดใหญ่อย่าง PDF การ์ตูนแต่ละตอน ทนต่อปัญหาเน็ตหลุด/ไฟล์ใหญ่ได้ดีกว่าอัปโหลดแบบปกติ
async function uploadFileResumable(bucket,path,file,onProgress){
  if(!window.tus?.Upload || !TUS_ENDPOINT){
    // ถ้าโหลดไลบรารี TUS ไม่สำเร็จ (เช่นเน็ตหลุดตอนโหลดสคริปต์) ให้ย้อนกลับไปอัปโหลดแบบปกติแทน เพื่อไม่ให้ผู้ใช้อัปโหลดไม่ได้เลย
    onProgress?.(0);
    const {error}=await supabase.storage.from(bucket).upload(path,file,{contentType:file.type||"application/pdf",upsert:false});
    if(error)throw error;
    onProgress?.(100);
    return;
  }
  const {data:{session}}=await supabase.auth.getSession();
  await new Promise((resolve,reject)=>{
    const upload=new window.tus.Upload(file,{
      endpoint:TUS_ENDPOINT,
      retryDelays:[0,3000,5000,10000,20000],
      headers:{
        authorization:`Bearer ${session?.access_token||""}`,
        apikey:SUPABASE_ANON_KEY,
        "x-upsert":"false"
      },
      uploadDataDuringCreation:true,
      removeFingerprintOnSuccess:true,
      metadata:{
        bucketName:bucket,
        objectName:path,
        contentType:file.type||"application/pdf",
        cacheControl:"3600"
      },
      chunkSize:6*1024*1024, // ต้องเป็น 6MB ตามข้อกำหนดของ Supabase
      onError:err=>reject(err),
      onProgress:(loaded,total)=>{ if(total)onProgress?.(loaded/total*100) },
      onSuccess:()=>resolve()
    });
    upload.findPreviousUploads()
      .then(prev=>{ if(prev.length)upload.resumeFromPreviousUpload(prev[0]); upload.start() })
      .catch(()=>upload.start());
  });
}

function friendlyError(e){
  const msg=e?.message||String(e||"ไม่ทราบสาเหตุ");
  if(/row-level security|permission denied/i.test(msg)) return "ไม่มีสิทธิ์ดำเนินการ กรุณาตรวจสอบ role ใน profiles และ RLS Policies";
  if(/maximum size exceeded|413|payload too large/i.test(msg)) return "ไฟล์มีขนาดใหญ่เกินกว่าที่ Supabase Storage อนุญาต กรุณาไปที่ Dashboard > Storage > Settings แล้วเพิ่มค่า \"Global file size limit\" (และตรวจสอบขีดจำกัดของ bucket \"pdfs\" ด้วย) หมายเหตุ: แผน Free ตั้งได้สูงสุดแค่ 50MB เท่านั้น หากไฟล์ใหญ่กว่านี้ต้องอัปเกรดแผนหรือบีบอัดไฟล์ PDF ให้เล็กลง";
  if(/bucket/i.test(msg)) return "ยังไม่มี Storage Bucket ที่กำหนดไว้ กรุณารัน supabase_setup.sql";
  if(/invalid login credentials/i.test(msg)) return "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
  return msg;
}

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;

  const action = btn.dataset.action;

  try {
    if (action === "open-book") {
      e.preventDefault();
      window.openBook(btn.dataset.bookId);
    } else if (action === "back-library") {
      e.preventDefault();
      state.selectedBook = null;
      state.reader = null;
      state.pdf = null;
      state.cachedPages = {};
      state.view = "read";
      render();
    } else if (action === "start-reader") {
      e.preventDefault();
      btn.disabled = true;
      btn.style.opacity = ".65";
      await window.startReader(btn.dataset.bookId, Number(btn.dataset.chapterIndex));
    } else if (action === "close-reader") {
      e.preventDefault();
      window.closeReader();
    }
  } catch (err) {
    console.error("button action error:", err);
    alert("ไม่สามารถดำเนินการได้\n\n" + friendlyError(err));
  } finally {
    if (action === "start-reader") {
      btn.disabled = false;
      btn.style.opacity = "";
    }
  }
});

let pdfLoadToken=0;

window.startReader=async(bookId,index)=>{
  const b=state.books.find(x=>String(x.id)===String(bookId));
  const c=b?.chapters?.[index];

  if(!b){alert("ไม่พบหนังสือที่เลือก");return}
  if(!c?.url){alert("ตอนนี้ยังไม่มีไฟล์ PDF สำหรับอ่าน");return}

  const token=++pdfLoadToken;
  state.reader={book:b,chapterIndex:index,chapter:c};
  state.currentPage=1;
  state.view="read";
  state.cachedPages={};
  state.pdf=null;
  state.zoom=1;state.panX=0;state.panY=0;state._handShown=false;

  showProgressOverlay(`กำลังโหลด "${c.name||c.fileName||""}"...`);

  try{
    const pdf=await openPdf(c.url,token,pct=>{
      if(token!==pdfLoadToken)return;
      updateProgressOverlay(pct, `กำลังโหลดไฟล์ PDF... (${Math.round(pct)}%)`);
    });
    if(token!==pdfLoadToken || !state.reader){hideProgressOverlay();return}

    state.pdf=pdf;
    updateProgressOverlay(100,"กำลังแสดงผลหน้าแรก...");
    // แสดงหน้าคู่แรกทันที ไม่รอ cache 10 หน้า
    if(token!==pdfLoadToken || !state.reader){hideProgressOverlay();return}
    render();
    hideProgressOverlay();
    showHandHint("แตะ/ลากที่หน้ากระดาษ • กด + หรือบีบนิ้วเพื่อขยาย แล้วลากเพื่อเลื่อนดู");
    // ค่อย cache หน้าอื่นเบื้องหลัง
    cachePdfPages(pdf,token).catch(e=>console.warn("background PDF cache:",e));
  }catch(e){
    hideProgressOverlay();
    if(token!==pdfLoadToken)return;
    console.error("startReader/openPdf:",e);
    state.reader=null;
    state.pdf=null;
    state.cachedPages={};
    render();
    alert("เปิด PDF ไม่สำเร็จ: "+friendlyError(e));
  }
};

async function openPdf(url,token,onProgress){
  const pdfjs=await pdfjsReady;
  if(token!==pdfLoadToken)throw new Error("การโหลด PDF ถูกยกเลิก");

  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
  const loadingTask=pdfjs.getDocument(url);
  if(onProgress){
    loadingTask.onProgress=p=>{
      if(token!==pdfLoadToken)return;
      if(p && p.total)onProgress(p.loaded/p.total*100);
    };
  }
  const pdf=await loadingTask.promise;

  if(token!==pdfLoadToken){
    try{pdf.cleanup?.()}catch(_){}
    throw new Error("การโหลด PDF ถูกยกเลิก");
  }
  return pdf;
}

async function cachePdfPages(pdf,token){
  for(let i=1;i<=Math.min(pdf.numPages,10);i++){
    if(token!==pdfLoadToken || !state.reader)return;

    const page=await pdf.getPage(i);
    if(token!==pdfLoadToken || !state.reader)return;

    const viewport=page.getViewport({scale:1.4});
    const canvas=document.createElement("canvas");
    canvas.width=viewport.width;
    canvas.height=viewport.height;

    await page.render({
      canvasContext:canvas.getContext("2d"),
      viewport
    }).promise;

    if(token!==pdfLoadToken || !state.reader)return;
    state.cachedPages[i]=canvas;
  }
}

      <button class="btn small" onclick="addBookmark()">🔖 คั่น</button>
      <button class="btn small" onclick="showBookmarks()">ไปที่คั่น</button>
      <button class="btn small" id="fullscreenBtn" onclick="toggleReaderFullscreen()">⛶ เต็มหน้าจอ</button>
      <div class="zoomControls">
        <button type="button" title="ย่อ" onclick="zoomOut()">−</button>
        <span class="zlabel" id="zoomLabel">${Math.round(state.zoom*100)}%</span>
        <button type="button" title="ขยาย" onclick="zoomIn()">+</button>
        <button type="button" title="รีเซ็ตขนาด" onclick="zoomReset()" style="width:auto;padding:0 8px;">⟲</button>
      </div>
      <button class="btn small" id="soundBtn" onclick="toggleSound()">${state.soundOn?"🔊 เสียงพลิกหน้า":"🔇 ปิดเสียง"}</button>
      <div class="spacer"></div>
      <span style="font-size:13px;opacity:0.85">${esc(state.reader.book.title)}</span>
    </div>
  </div>`;
  renderPages();
  setupTouchEvents();
  applyZoomStyle(false);
}

window.changeView=v=>{
  const stage=$("#pdfstage");
  if(stage) stage.className = "pdfstage " + (v==="double"?"double":"single") + (state.deviceMode==="fold"?" device-fold":"");
  renderPages();
};

window.changeDevice=mode=>{
  state.deviceMode = mode;
  const stage=$("#pdfstage");
  const isDouble = $("#viewMode")?.value === "double";
  if(stage) stage.className = "pdfstage " + (isDouble?"double":"single") + (mode==="fold"?" device-fold":"");
  renderPages();
};

window.renderPages=async()=>{
  const stage=$("#pdfstage");
  const pdf=state.pdf;
  if(!stage || !pdf || !state.reader)return;

  stage.classList.remove("turning", "turning-next", "turning-prev");
  stage.innerHTML="";
  const mode=$("#viewMode")?.value||"double";
  // โหมดหนังสือ: หน้า 1-2, 3-4, 5-6 ... เป็นหน้าคู่ติดกัน
  const pages=mode==="double"
    ? [state.currentPage % 2 === 0 ? state.currentPage-1 : state.currentPage, state.currentPage % 2 === 0 ? state.currentPage : state.currentPage+1]
    : [state.currentPage];

  const rendered=await Promise.all(pages.map(async p=>{
    if(!state.reader || state.pdf!==pdf || p<1 || p>pdf.numPages)return null;
    if(state.cachedPages[p])return state.cachedPages[p];

    const page=await pdf.getPage(p);
    if(!state.reader || state.pdf!==pdf)return null;
    const viewport=page.getViewport({scale:1.4});
    const canvas=document.createElement("canvas");
    canvas.width=viewport.width;
    canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
    if(!state.reader || state.pdf!==pdf)return null;
    state.cachedPages[p]=canvas;
    return canvas;
  }));

  if(!state.reader || state.pdf!==pdf)return;
  rendered.forEach((canvas,index)=>{
    if(!canvas)return;
    const wrap=document.createElement("div");
    wrap.className="pagewrap " + (mode==="double" ? (index===0?"spread-left":"spread-right") : "");
    // ใช้ canvas เดิม ไม่ clone เพราะ cloneNode ไม่คัดลอกพิกเซลของ canvas
    wrap.appendChild(canvas);
    stage.appendChild(wrap);
  });
};

function applyAnimationStyles(element, phase){
  const anim = state.flipAnim;
  const speed = Number($("#speed")?.value||300);
  element.style.transition = `transform ${speed}ms cubic-bezier(0.25, 1, 0.5, 1), opacity ${speed}ms ease`;
  if(phase === "in"){
    if(anim === "bottom"){
      element.style.transform = "translateY(60px) scale(0.98)";
      element.style.opacity = "0";
    } else {
      element.style.transform = "rotateY(-45deg) scale(0.95)";
      element.style.opacity = "0";
    }
    requestAnimationFrame(()=>{
      element.style.transform = "translateY(0) rotateY(0deg) scale(1)";
      element.style.opacity = "1";
    });
  }
}

window.gotoPage=p=>{
  if(!state.pdf || !state.reader)return;
  p=Math.max(1,Math.min(state.pdf.numPages,Number(p)||1));
  state.currentPage=p;
  renderPages();
  saveProgress();
};

async function turnBook(direction){
  if(!state.pdf || !state.reader)return;
  const mode=$("#viewMode")?.value||"double";
  const step=mode==="double"?2:1;
  const target=state.currentPage + direction*step;
  if(target<1 || target>state.pdf.numPages)return;

  const stage=$("#pdfstage");
  const speed=Math.min(420,Math.max(180,Number($("#speed")?.value||300)));
  if(mode==="double" && stage){
    stage.classList.remove("turning-next","turning-prev");
    void stage.offsetWidth;
    stage.classList.add(direction>0?"turning-next":"turning-prev");
    await new Promise(r=>setTimeout(r,speed));
  }
  state.currentPage=target;
  saveProgress();
  playPageTurnSound();
  await renderPages();
}
window.prevPage=()=>turnBook(-1);
window.nextPage=()=>turnBook(1);

function clampPan(){
  const st=$("#pdfstage");if(!st)return;const z=state.zoom;
  if(z<=1){state.panX=0;state.panY=0;return}
  const mx=Math.max(0,(st.offsetWidth*z-window.innerWidth)/2)+60,my=Math.max(0,(st.offsetHeight*z-window.innerHeight)/2)+60;
  state.panX=Math.max(-mx,Math.min(mx,state.panX));state.panY=Math.max(-my,Math.min(my,state.panY));
}
function showHandHint(text){
  $("#handHint")?.remove();const d=document.createElement("div");d.id="handHint";
  d.innerHTML=`<span class="h">🖐️</span>${esc(text)}`;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);
}
function applyZoomStyle(animate){
  const stage=$("#pdfstage");if(!stage)return;
  clampPan();
  stage.classList.toggle("zooming",!animate);
  stage.classList.toggle("pannable",state.zoom>1.01);
  stage.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
  const label=$("#zoomLabel");if(label)label.textContent=Math.round(state.zoom*100)+"%";
  const book=$(".readerbook");if(book)book.style.overflow="hidden";
  if(state.zoom>1.01&&!state._handShown){state._handShown=true;showHandHint("ลากเพื่อเลื่อนดูตำแหน่งต่างๆ ในหน้าหนังสือ")}
  if(state.zoom<=1.01)state._handShown=false;
}
// รูปมือ 🖐️/✊ ตามเมาส์ และลากเพื่อเลื่อนหน้าที่ขยายอยู่ (เมาส์)
(function(){
  let drag=false,moved=0,lx=0,ly=0,suppress=false;
  const okTarget=t=>t.closest?.("#pdfstage,.readerbook")&&!t.closest(".readerbar,.pageNav");
  document.addEventListener("mousemove",e=>{
    if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);state.panX+=dx;state.panY+=dy;lx=e.clientX;ly=e.clientY;applyZoomStyle(false)}
    let c=$("#handCursor");
    if(state.reader&&state.zoom>1.01&&okTarget(e.target)){
      if(!c){c=document.createElement("div");c.id="handCursor";document.body.appendChild(c)}
      c.style.display="block";c.style.left=e.clientX+"px";c.style.top=e.clientY+"px";c.textContent=drag?"✊":"🖐️";
    }else if(c)c.style.display="none";
  });
  document.addEventListener("mousedown",e=>{if(state.reader&&state.zoom>1.01&&okTarget(e.target)){drag=true;moved=0;lx=e.clientX;ly=e.clientY;e.preventDefault()}});
  document.addEventListener("mouseup",()=>{if(drag&&moved>4)suppress=true;drag=false});
  document.addEventListener("click",e=>{if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);
})();

window.zoomIn=()=>{
  state.zoom=Math.min(state.maxZoom,+(state.zoom+0.25).toFixed(2));
  applyZoomStyle(true);
};
window.zoomOut=()=>{
  state.zoom=Math.max(state.minZoom,+(state.zoom-0.25).toFixed(2));
  applyZoomStyle(true);
};
window.zoomReset=()=>{
  state.zoom=1;state.panX=0;state.panY=0;
  applyZoomStyle(true);
};
window.toggleSound=()=>{
  state.soundOn=!state.soundOn;
  const btn=$("#soundBtn");
  if(btn)btn.textContent=state.soundOn?"🔊 เสียงพลิกหน้า":"🔇 ปิดเสียง";
};

window.toggleReaderFullscreen=async()=>{
  const reader=document.querySelector(".reader");
  if(!reader)return;
  try{
    if(!document.fullscreenElement){
      await reader.requestFullscreen();
      state.barVisible=false;
    }else{
      await document.exitFullscreen();
      state.barVisible=true;
    }
    const bar=$(".readerbar"),hint=$(".readerHint");
    if(bar)bar.classList.toggle("hidden-bar",!state.barVisible);
    if(hint)hint.style.opacity=state.barVisible?"0":"1";
    const btn=$("#fullscreenBtn");
    if(btn)btn.textContent=document.fullscreenElement?"⛶ ออกจากเต็มหน้าจอ":"⛶ เต็มหน้าจอ";
  }catch(err){
    console.warn("Fullscreen unavailable",err);
  }
};

document.addEventListener("fullscreenchange",()=>{
  const bar=$(".readerbar"),hint=$(".readerHint"),btn=$("#fullscreenBtn");
  if(document.fullscreenElement){
    state.barVisible=false;
  }else{
    state.barVisible=true;
  }
  if(bar)bar.classList.toggle("hidden-bar",!state.barVisible);
  if(hint)hint.style.opacity=state.barVisible?"0":"1";
  if(btn)btn.textContent=document.fullscreenElement?"⛶ ออกจากเต็มหน้าจอ":"⛶ เต็มหน้าจอ";
});

window.addBookmark=()=>{
  const key=`${state.reader.book.id}_${state.reader.chapterIndex}`;
  state.bookmarks[key]=state.currentPage;
  localStorage.setItem("comicBookmarks",JSON.stringify(state.bookmarks));
  alert("บันทึกที่คั่นหน้าแล้ว");
};

window.showBookmarks=()=>{
  const key=`${state.reader.book.id}_${state.reader.chapterIndex}`,p=state.bookmarks[key];
  if(p)gotoPage(p);else alert("ยังไม่มีที่คั่นสำหรับตอนนี้");
};

function saveProgress(){
  localStorage.setItem(`comicProgress_${state.reader.book.id}_${state.reader.chapterIndex}`,String(state.currentPage));
}

function touchDist(t1,t2){
  const dx=t1.clientX-t2.clientX, dy=t1.clientY-t2.clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

function setupTouchEvents(){
  const stage = $("#pdfstage");
  if(!stage) return;

  stage.addEventListener("touchstart", e=>{
    if(e.touches.length === 2){
      // เริ่มท่าทางบีบนิ้ว (pinch) เพื่อขยาย/ย่อ
      state.pinchActive = true;
      state.pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      state.pinchStartZoom = state.zoom;
    } else if(e.touches.length === 1){
      state.pinchActive = false;
      state.touchStartX = e.touches[0].clientX;state.panStartX=e.touches[0].clientX;state.panStartY=e.touches[0].clientY;
      state.touchStartY = e.touches[0].clientY;
    }
  }, {passive: true});

  stage.addEventListener("touchmove", e=>{
    if(e.touches.length === 2 && state.pinchActive){
      e.preventDefault(); // กันไม่ให้เบราว์เซอร์ซูมทั้งหน้าเว็บแทน
      const d = touchDist(e.touches[0], e.touches[1]);
      if(state.pinchStartDist > 0){
        const ratio = d / state.pinchStartDist;
        let z = state.pinchStartZoom * ratio;
        z = Math.max(state.minZoom, Math.min(state.maxZoom, z));
        state.zoom = +z.toFixed(2);
        applyZoomStyle(false);
      }
    } else if(e.touches.length === 1 && state.zoom > 1.01 && !state.pinchActive){
      e.preventDefault();
      const t=e.touches[0];
      state.panX+=t.clientX-state.panStartX;state.panY+=t.clientY-state.panStartY;
      state.panStartX=t.clientX;state.panStartY=t.clientY;
      applyZoomStyle(false);
    }
  }, {passive: false});

  stage.addEventListener("touchend", e=>{
    if(e.touches.length < 2 && state.pinchActive){
      state.pinchActive = false;
      applyZoomStyle(true);
      return;
    }
    if(state.pinchActive) return;
    if(state.zoom > 1.01) { state.touchStartX=0; state.touchStartY=0; return; } // ซูมอยู่: ให้ปัดหน้าจอเพื่อเลื่อนดูแทนการพลิกหน้า
    if(!state.touchStartX || !state.touchStartY) return;
    const diffX = e.changedTouches[0].clientX - state.touchStartX;
    const diffY = e.changedTouches[0].clientY - state.touchStartY;
    
    if(Math.abs(diffX) > Math.abs(diffY)){
      if(diffX > 50) prevPage();
      else if(diffX < -50) nextPage();
    } else {
      if(state.flipAnim === "bottom"){
        if(diffY > 50) prevPage();
        else if(diffY < -50) nextPage();
      }
    }
    state.touchStartX = 0;
    state.touchStartY = 0;
  }, {passive: true});
}

document.addEventListener("keydown",e=>{
  if(!state.pdf)return;
  if(e.key==="ArrowRight")nextPage();
  if(e.key==="ArrowLeft")prevPage();
  if(e.key==="Home")gotoPage(1);
  if(e.key==="End")gotoPage(state.pdf.numPages);
  if(e.key==="+"||e.key==="=")zoomIn();
  if(e.key==="-"||e.key==="_")zoomOut();
  if(e.key==="0")zoomReset();
});

// จัดการคลิกบนหน้าจอตัวอ่านหนังสือโดยแยกออกจากปุ่มอย่างเด็ดขาด
window.addEventListener("click", e => {
  if(!state.reader) return;
  const stage = $("#pdfstage");
  if (!stage) return;
  
  if (e.target.closest(".readerbar") || e.target.closest("button") || e.target.closest("select") || e.target.closest("input") || e.target.closest(".modal")) return;

  const rect = stage.getBoundingClientRect(), x = e.clientX - rect.left;
  
  if (!state.barVisible) {
    state.barVisible = true;
    const bar = $(".readerbar");
    const hint = $(".readerHint");
    if (bar) bar.classList.remove("hidden-bar");
    if (hint) hint.style.opacity = "0";
    return;
  }

  if (x < rect.width * 0.25) {
    prevPage();
  } else if (x > rect.width * 0.75) {
    nextPage();
  } else {
    state.barVisible = !state.barVisible;
    const bar = $(".readerbar");
    const hint = $(".readerHint");
    if (bar) bar.classList.toggle("hidden-bar", !state.barVisible);
    if (hint) hint.style.opacity = state.barVisible ? "0" : "1";
  }
});

async function init(){
 if(!configured){state.user={id:"demo"};state.admin=true;state.books=[];render();return}
 const {data:{session}}=await supabase.auth.getSession();
 state.user=session?.user||null;
 state.admin=state.user?await getAdmin(state.user):false;
 await refreshBooks();
 supabase.auth.onAuthStateChange(async(event,session)=>{
  if(event!=="SIGNED_IN"&&event!=="SIGNED_OUT")return;
  const u=session?.user||null;
  if(u?.id===state.user?.id)return;
  state.user=u;state.admin=u?await getAdmin(u):false;
  state.view=state.admin?"manage":"read";
  await refreshBooks();
 });
}
init();
</script>
